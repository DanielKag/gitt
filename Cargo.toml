[package]
name = "gitt"
version = "0.1.0"
edition = "2024"

[dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde_json = "1.0.145"
thiserror = "2.0.18"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.48.0", features = ["filters", "yaml"] }
portable-pty = "0.9.0"
predicates = "3.1.4"
tempfile = "3.27.0"
vt100 = "0.16.2"

# Speed up snapshot testing (insta/similar) in debug builds.
[profile.dev.package.insta]
opt-level = 3
[profile.dev.package.similar]
opt-level = 3
