[package]
name = "gitt"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "An interactive git TUI: fuzzy log, staging, diffs, and branches"
authors = ["Daniel Kagan"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/danielkag/gitt"
homepage = "https://github.com/danielkag/gitt"
keywords = ["git", "tui", "cli", "ratatui", "fuzzy"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/specs", "/tests", "/.github", "/CLAUDE.md"]

[dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde_json = "1.0.145"
thiserror = "2.0.18"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.48.0", features = ["filters", "yaml"] }
portable-pty = "0.9.0"
predicates = "3.1.4"
tempfile = "3.27.0"
vt100 = "0.16.2"

# Speed up snapshot testing (insta/similar) in debug builds.
[profile.dev.package.insta]
opt-level = 3
[profile.dev.package.similar]
opt-level = 3

# Released binaries: `gitt` must feel instant, and it ships as a single downloaded file, so trade
# build time for a smaller, faster artifact.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
